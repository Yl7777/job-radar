<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{TITLE}</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#f5f6f8;color:#222;margin:0;padding:24px}
  .wrap{max-width:880px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#666;font-size:13px;margin-bottom:16px}
  .stat{display:inline-block;background:#fff;border:1px solid #eee;border-radius:10px;
        padding:8px 14px;margin:0 8px 16px 0;font-size:13px}
  .card{background:#fff;border:1px solid #eee;border-radius:12px;padding:14px 16px;
        margin-bottom:12px}
  .card.closed{border-color:#f3b0b0;background:#fff6f6}
  .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap}
  .badge.closed{background:#A32D2D}
  .event{font-size:12px;color:#555;background:#eef2f7;border-radius:6px;padding:2px 8px;white-space:nowrap}
  .verify{font-size:12px;background:#fff;border:1px solid #ddd;border-radius:6px;
          padding:1px 8px;white-space:nowrap;cursor:help}
  .warnbar{background:#FFF4E5;border:1px solid #FFB74D;color:#8A4B00;border-radius:10px;
           padding:12px 16px;margin-bottom:16px;font-size:13px;line-height:1.6}
  .warnbar code{background:#fff;border:1px solid #e0c9a6;border-radius:4px;padding:1px 6px}
  .title{font-size:15px;font-weight:600}
  .title a{color:#185FA5;text-decoration:none}
  .meta{display:flex;gap:16px;flex-wrap:wrap;color:#555;font-size:13px;margin:8px 0}
  .match{font-size:13px;color:#0F6E56;margin:4px 0}
  .desc{font-size:13px;color:#444;line-height:1.6;margin-top:4px;
         max-height:120px;overflow:auto}
  .recheck{font-size:12px;color:#8A4B00;background:#FFF4E5;border:1px solid #FFB74D;
           border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.6}
  .closed-h{font-size:16px;color:#A32D2D;margin:24px 0 8px}
  .empty{color:#888;background:#fff;border:1px dashed #ccc;border-radius:12px;
          padding:24px;text-align:center}
  footer{color:#999;font-size:12px;margin-top:24px;text-align:center}
</style></head>
<body><div class="wrap">
  <h1>{TITLE}</h1>
  <div class="sub">生成时间 {GENTIME} · 仅含本期变化（新增 / 更新 / 重开 / 疑似下架）</div>
  <div>{STATS}</div>
  {BODY}
  <footer>由 job-radar 生成 · 岗位信息来自第三方平台，投递前请自行核实</footer>
</div></body></html>
